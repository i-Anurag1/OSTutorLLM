services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ostutor}
      POSTGRES_USER: ${POSTGRES_USER:-ostutor}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ostutor}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U ${POSTGRES_USER:-ostutor} -d ${POSTGRES_DB:-ostutor}"]
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD","redis-cli","ping"]
      interval: 5s
      timeout: 3s
      retries: 10
  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-ostutor}:${POSTGRES_PASSWORD:-ostutor}@db:5432/${POSTGRES_DB:-ostutor}
      REDIS_URL: redis://redis:6379/0
    command: ["sh","-c","uvicorn app.main:app --host 0.0.0.0 --port 8000"]
    ports: ["8000:8000"]
    volumes: [./backend/data:/app/data]
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
    healthcheck:
      test: ["CMD","python","-c","import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
  web:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    ports: ["3000:3000"]
    depends_on:
      api: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL","wget -q -O - http://localhost:3000 >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 10
volumes:
  pgdata:
