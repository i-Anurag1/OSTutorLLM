x-api-env: &api-env
  DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-ostutor}:${POSTGRES_PASSWORD:-ostutor}@db:5432/${POSTGRES_DB:-ostutor}
  REDIS_URL: redis://redis:6379/0
  JWT_SECRET: ${JWT_SECRET:-ostutor-local-development-secret-change-in-production}
  CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
  LLM_BASE_URL: ${LLM_BASE_URL:-http://host.docker.internal:11434/v1}
  LLM_API_KEY: ${LLM_API_KEY:-}
  LLM_REQUIRED: ${LLM_REQUIRED:-1}
  LLM_MODEL: ${LLM_MODEL:-qwen3:14b}
  LLM_NUM_PREDICT: ${LLM_NUM_PREDICT:-900}
  LLM_TIMEOUT: ${LLM_TIMEOUT:-300}
  EMBEDDING_MODEL: ${EMBEDDING_MODEL:-BAAI/bge-large-en-v1.5}
  RERANKER_MODEL: ${RERANKER_MODEL:-BAAI/bge-reranker-base}
  RAG_DENSE_K: ${RAG_DENSE_K:-24}
  RAG_SPARSE_K: ${RAG_SPARSE_K:-24}
  RAG_RERANK_K: ${RAG_RERANK_K:-12}
  RAG_MIN_COVERAGE: ${RAG_MIN_COVERAGE:-0.4}
  CACHE_TTL_SECONDS: ${CACHE_TTL_SECONDS:-900}
  MAX_CODE_SECONDS: ${MAX_CODE_SECONDS:-3}
  HF_HOME: /root/.cache/huggingface

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ostutor}
      POSTGRES_USER: ${POSTGRES_USER:-ostutor}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ostutor}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ostutor} -d ${POSTGRES_DB:-ostutor}"]
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
  api:
    build: ./backend
    environment: *api-env
    ports: ["8000:8000"]
    volumes:
      - ./backend/data:/app/data
      - hf_cache:/root/.cache/huggingface
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
    extra_hosts:
      - host.docker.internal:host-gateway
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
  worker:
    build: ./backend
    environment: *api-env
    command: ["python", "-m", "app.worker"]
    volumes:
      - ./backend/data:/app/data
      - hf_cache:/root/.cache/huggingface
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
  web:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    ports: ["3000:3000"]
    depends_on:
      api: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:3000 >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 10
volumes:
  pgdata:
  hf_cache:
