name: CI
on:
  push:
  pull_request:

jobs:
  offline-tests:
    name: Backend logic + training pipeline (no services)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install numpy==2.2.5 scipy==1.15.3 python-docx==1.1.2 python-pptx==1.0.2 pypdf==5.4.0 pydantic-settings==2.9.1
      - run: python scripts/verify.py

  api:
    name: API integration tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: ostutor
          POSTGRES_USER: ostutor
          POSTGRES_PASSWORD: ostutor
        ports: ["5432:5432"]
        options: >-
          --health-cmd="pg_isready -U ostutor -d ostutor" --health-interval=5s --health-timeout=5s --health-retries=10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    env:
      DATABASE_URL: postgresql+psycopg://ostutor:ostutor@localhost:5432/ostutor
      REDIS_URL: redis://localhost:6379/0
      OSTUTOR_TEST_MODE: "1"
      LLM_REQUIRED: "0"
      LLM_BASE_URL: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends procps
      - run: pip install -r backend/requirements.txt
      - run: pytest -q tests
        working-directory: backend
        env:
          PYTHONPATH: .

  frontend:
    name: Frontend type-check and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install
        working-directory: frontend
      - run: npm run typecheck
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
